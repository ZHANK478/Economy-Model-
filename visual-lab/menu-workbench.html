<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Республика — примерочная меню</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../main-menu.css"><style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}#main-menu .menu-content{left:var(--panel-x,59.7%);width:var(--panel-w,33.6%)}#main-menu .menu-content header{margin-top:var(--header-y,10vh);background:var(--band,#281717)}#main-menu .menu-content nav button{height:var(--row,8.6vh)}#main-menu .menu-content nav{padding-top:var(--nav-top,4vh)}#main-menu .menu-content h1{font-size:var(--title-size,44px)}#main-menu .menu-map{width:100%;background-size:auto 100%;background-position:var(--map-x,12%) center;background-color:#9eac98}#main-menu .menu-light{background:linear-gradient(90deg,#221b151a,transparent 42%,#201b141a)}
#editor{position:fixed;z-index:1002;left:18px;bottom:18px;width:290px;max-height:80vh;overflow:auto;background:#171a18f5;color:#e1dcc6;border:1px solid #727363;border-radius:7px;box-shadow:0 5px 30px #0006;font:12px/1.4 system-ui,sans-serif;padding:15px;box-sizing:border-box}#editor[hidden]{display:none}#editor h2{margin:0;font-size:15px}#editor p{color:#aaa996;font-size:11px;margin:7px 0 13px}#editor button,#editor select{background:#2d332c;color:#e5dfc4;border:1px solid #636854;border-radius:4px;padding:7px;cursor:pointer}#editor .presets{display:flex;gap:5px;margin:12px 0}#editor label{display:block;margin-top:10px}#editor input[type=range]{display:block;width:100%;accent-color:#d0bc87;margin:5px 0}#editor output{float:right;color:#d5c18c}#editor select{width:100%;margin-top:5px}#editor .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}#editor .top{display:flex;justify-content:space-between;align-items:center}#editor .top button{padding:2px 6px}#toggle-editor{position:fixed;z-index:1001;left:18px;top:14px;padding:7px 11px;background:#161c18e6;color:#e1dcc6;border:1px solid #777b65;border-radius:4px;font:12px system-ui;cursor:pointer}#notice{min-height:16px;display:block;margin-top:9px;color:#d7c491}#preview-dialog{color:#d4cda3;background:#111310;border:1px solid #787557;padding:30px;max-width:420px;font:18px/1.5 Georgia,serif}#preview-dialog::backdrop{background:#0009}#preview-dialog button{padding:9px 20px;background:#292e24;border:1px solid #7b7e64;color:#e5dfc4;cursor:pointer}@media(max-width:600px){#editor{width:260px;max-height:65vh;left:8px;bottom:8px}}
</style></head><body><div id="app"></div><button id="toggle-editor" aria-expanded="true">Примерочная · H</button><aside id="editor" aria-label="Редактор меню"><div class="top"><h2>То же меню, другое расположение</h2><button id="hide-editor" aria-label="Скрыть редактор">×</button></div><p>Меняется только этот макет. Игра и сохранения не затрагиваются. H — скрыть панель.</p><div class="presets"><button data-preset="right">Справа</button><button data-preset="left">Слева</button><button data-preset="center">По центру</button></div><div id="sliders"></div><label>Полоса заголовка<select id="palette"><option value="#281717">Бордовая · исходная</option><option value="#222a20">Тёмная олива</option><option value="#20282d">Дымчатая синяя</option><option value="#30251d">Тёплая коричневая</option></select></label><div class="actions"><button id="save-a">Запомнить A</button><button id="compare">Показать A</button><button id="reset">Сброс</button><button id="share">Скопировать ссылку</button></div><span id="notice" role="status"></span></aside><dialog id="preview-dialog"><h2>Проверка кнопки</h2><p>Здесь только примерочная главного меню. Запуск партии и чтение сохранений отключены.</p><button>Вернуться к макету</button></dialog><script type="module">
import {mountMainMenu} from '../src/main-menu.js';
const demo=document.querySelector('#preview-dialog');const preview=()=>demo.showModal();demo.querySelector('button').onclick=()=>demo.close();
const menu=mountMainMenu({hasSave:true,onNew:preview,onLoad:preview,onContinue:()=>{menu.show();preview();}});
const root=document.querySelector('#main-menu');root.querySelector('.menu-version').textContent='ПРИМЕРОЧНАЯ МЕНЮ';root.querySelector('.menu-studio').style.display='none';
const defaults={x:59.7,w:33.6,row:8.6,top:4,head:10,title:44,map:12,band:'#281717'};
const definitions=[['x','Положение панели',0,76,.1,'--panel-x','%'],['w','Ширина панели',24,42,.1,'--panel-w','%'],['row','Расстояние между пунктами',6,10,.1,'--row','vh'],['top','Отступ списка сверху',0,8,.1,'--nav-top','vh'],['head','Высота положения заголовка',2,15,.1,'--header-y','vh'],['title','Размер названия',28,60,1,'--title-size','px'],['map','Положение карты',0,100,1,'--map-x','%']];
let state={...defaults},savedA=null,other=null,showingA=false;
function safe(raw){const s={...defaults};for(const [key,,min,max] of definitions){const n=Number(raw?.[key]);if(Number.isFinite(n)&&raw?.[key]!==undefined)s[key]=Math.min(max,Math.max(min,n));}if(/^#[0-9a-f]{6}$/i.test(raw?.band??''))s.band=raw.band;s.x=Math.min(s.x,100-s.w);return s;}
try{state=safe(JSON.parse(decodeURIComponent(location.hash.slice(1))));}catch{}
const sliders=document.querySelector('#sliders');sliders.innerHTML=definitions.map(([k,label,min,max,step])=>`<label for="control-${k}">${label}<output id="out-${k}"></output><input id="control-${k}" data-key="${k}" type="range" min="${min}" max="${max}" step="${step}"></label>`).join('');
function apply(){state=safe(state);const editor=document.querySelector('#editor');editor.style.left=state.x<40?'auto':'18px';editor.style.right=state.x<40?'18px':'auto';for(const [key,,, , ,property,unit] of definitions){root.style.setProperty(property,state[key]+unit);document.querySelector('#control-'+key).value=state[key];document.querySelector('#out-'+key).textContent=state[key]+unit;}root.style.setProperty('--band',state.band);document.querySelector('#palette').value=state.band;history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify(state)));}
function changed(){showingA=false;document.querySelector('#compare').textContent='Показать A';document.querySelector('#notice').textContent='';apply();}
sliders.oninput=e=>{if(e.target.dataset.key){state[e.target.dataset.key]=Number(e.target.value);changed();}};document.querySelector('#palette').onchange=e=>{state.band=e.target.value;changed();};
for(const b of document.querySelectorAll('[data-preset]'))b.onclick=()=>{state={...defaults,x:b.dataset.preset==='right'?59.7:b.dataset.preset==='left'?6.7:33.2,map:b.dataset.preset==='left'?85:12};changed();};
document.querySelector('#reset').onclick=()=>{state={...defaults};changed();};
document.querySelector('#save-a').onclick=()=>{savedA={...state};showingA=false;document.querySelector('#compare').textContent='Показать A';document.querySelector('#notice').textContent='Вариант A запомнен. Теперь изменяй параметры.';};
document.querySelector('#compare').onclick=()=>{if(!savedA){document.querySelector('#notice').textContent='Сначала запомни вариант A.';return;}if(!showingA){other={...state};state={...savedA};}else state={...other};showingA=!showingA;document.querySelector('#compare').textContent=showingA?'Вернуться к B':'Показать A';apply();};
document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#notice').textContent='Ссылка с текущими настройками скопирована.';}catch{document.querySelector('#notice').textContent='Скопируй адрес из строки браузера: настройки уже в ссылке.';}};
function toggle(){const editor=document.querySelector('#editor');editor.hidden=!editor.hidden;document.querySelector('#toggle-editor').setAttribute('aria-expanded',String(!editor.hidden));}document.querySelector('#toggle-editor').onclick=toggle;document.querySelector('#hide-editor').onclick=toggle;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))toggle();});apply();
</script></body></html>
