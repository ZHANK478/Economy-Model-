plugins { id 'com.android.application' }
android {
    namespace 'kz.zhank.economymodel'
    compileSdk 35
    defaultConfig {
        applicationId 'kz.zhank.economymodel'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '5.0.0-mobile.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['../../dist'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
