<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1b2530">
  <meta name="description" content="Исследуйте макроэкономику: управляйте политикой государства, переходите по месяцам и сравнивайте экономические гипотезы.">
  <title>Республика</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <dialog id="new-dialog">
    <form id="new-form">
      <button class="dialog-close" type="button" aria-label="Закрыть">×</button>
      <span class="eyebrow">2000</span>
      <h2>Новая игра</h2><p id="new-government-description" hidden></p><p id="new-country-description" hidden></p>
      <label class="field">За кого играешь?<select name="government" id="new-government"></select></label>
      <label class="field">Партия<select name="party" id="new-party"></select></label>
      <label class="field">Уровень развития страны<select name="country" id="new-country"></select></label>
      <label class="field">Структура экономики<select name="resource"><option value="true">Сырьевая</option><option value="false">Диверсифицированная</option></select></label>
      <button class="primary wide" type="submit">Начать</button>
    </form>
  </dialog>
  <noscript>Для работы модели включите JavaScript в браузере.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
