<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1b2530">
  <meta name="description" content="Исследуйте макроэкономику: управляйте политикой государства, переходите по месяцам и сравнивайте экономические гипотезы.">
  <title>Mandatewright</title>
  <link href="./assets/fonts/interface-fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./main-menu.css">
</head>
<body>
  <dialog id="game-language" class="menu-options language-picker" aria-labelledby="game-language-title" data-locale-fixed>
    <p class="game-language-name" lang="en">Mandatewright</p>
    <h1 id="game-language-title"><span lang="en">Choose your language</span><span lang="ru">Выберите язык</span></h1>
    <div class="game-language-buttons">
      <button type="button" lang="en" data-language="en">English</button>
      <button type="button" lang="ru" data-language="ru">Русский</button>
    </div>
  </dialog>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,application/gzip,.json,.json.gz,.gz" hidden>
  <dialog id="new-dialog" class="start-dialog" aria-label="Новая игра">
    <form id="new-form">
      <button data-close-button class="dialog-close" type="button" aria-label="Закрыть">×</button>
      <div class="start-masthead"><span>Mandatewright</span><small>НОВАЯ ИСТОРИЯ</small></div>
      <p id="new-government-description" hidden></p><p id="new-country-description" hidden></p>
      <div class="start-native" hidden>
        <select name="government" id="new-government" aria-label="Форма правления"></select>
        <select name="party" id="new-party" aria-label="Партия"></select>
        <select name="country" id="new-country" aria-label="Страна"></select>
        <select name="resource" id="new-resource" aria-label="Структура экономики"><option value="true">Сырьевая</option><option value="false">Диверсифицированная</option></select>
      </div>
      <div id="new-choice-content"></div>
    </form>
  </dialog>
  <noscript>Для работы модели включите JavaScript в браузере.</noscript>
  <script type="module" src="./src/language-selection.js"></script>
</body>
</html>
