<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#174ca1">
  <meta name="description" content="Исследуйте макроэкономику: управляйте политикой государства, переходите по месяцам и сравнивайте экономические гипотезы.">
  <title>Экономическая лаборатория</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <dialog id="new-dialog">
    <form id="new-form">
      <button class="dialog-close" type="button" aria-label="Закрыть">×</button>
      <span class="eyebrow">ИСХОДНЫЕ УСЛОВИЯ</span>
      <h2>Новая игра</h2>
      <p>Январь 2000 года. Вымышленная страна, 10 млн жителей.</p>
      <label class="field">За кого играешь?<select name="government" id="new-government"></select></label>
      <p class="small muted" id="new-government-description"></p>
      <label class="field">Партия<select name="party" id="new-party"></select></label>
      <label class="field">Уровень развития страны<select name="country" id="new-country"></select></label>
      <p class="small muted" id="new-country-description"></p>
      <label class="field">Структура экономики<select name="resource"><option value="true">Сырьевая: добыча определяет экспорт</option><option value="false">Диверсифицированная: промышленность и услуги</option></select></label>
      <p class="muted small">Текущий эксперимент будет заменён. Скачайте сохранение, если хотите к нему вернуться. Коэффициенты условные; модель не откалибрована под конкретную страну.</p>
      <button class="primary wide" type="submit">Начать с января 2000</button>
    </form>
  </dialog>
  <noscript>Для работы модели включите JavaScript в браузере.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
